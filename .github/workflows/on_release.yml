name: Release
on:
  release:
    types:
      - released
permissions:
  contents: read
jobs:
  push-container-tags:
    runs-on: ubuntu-latest
    name: Push container release tags
    env:
      DOCKER_IMAGE_NAME_AUTH: newrelic/agent-control-system-identity-registration
    steps:
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.OHAI_DOCKER_HUB_ID }}
          password: ${{ secrets.OHAI_DOCKER_HUB_PASSWORD }}

      - name: Push release tags
        run: |
          docker buildx imagetools create \
            -t "$DOCKER_IMAGE_NAME_AUTH:${{ github.event.release.tag_name }}" \
            -t "$DOCKER_IMAGE_NAME_AUTH:latest" \
            "$DOCKER_IMAGE_NAME_AUTH:${{ github.event.release.tag_name }}-rc"
